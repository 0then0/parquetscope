[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "parquetscope"
version = "0.1.0"
description = "Visualize DuckDB’s Parquet range reads, map them to file structure, and compare query runs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["duckdb==1.5.6", "pyarrow>=23", "fastapi>=0.135", "uvicorn>=0.41", "pydantic>=2.12"]

[project.scripts]
parquetscope = "parquetscope.cli:main"

[dependency-groups]
dev = ["pytest>=9", "httpx>=0.28", "ruff>=0.15", "build>=1.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/parquetscope"]

[tool.hatch.build.targets.sdist]
skip-excluded-dirs = true
include = ["/src", "/frontend", "/tests", "/scripts", "/docs", "/.github", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version"]
exclude = ["/frontend/node_modules", "/frontend/test-results", "/frontend/playwright-report", "/frontend/*.tsbuildinfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
