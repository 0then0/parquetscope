<svg
  xmlns="http://www.w3.org/2000/svg"
  width="112"
  height="112"
  viewBox="0 0 112 112"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">ParquetScope</title>
  <desc
    id="desc"
  >A highlighted byte range crossing the column chunks of one row group in a Parquet file.</desc>
  <rect
    x="2"
    y="2"
    width="108"
    height="108"
    rx="25"
    fill="#131923"
    stroke="#263040"
    stroke-width="2"
  />
  <g fill="#3f6d74">
    <rect x="20" y="25" width="20" height="16" rx="3" />
    <rect x="46" y="25" width="20" height="16" rx="3" />
    <rect x="72" y="25" width="20" height="16" rx="3" />
    <rect x="20" y="71" width="20" height="16" rx="3" />
    <rect x="46" y="71" width="20" height="16" rx="3" />
    <rect x="72" y="71" width="20" height="16" rx="3" />
  </g>
  <rect
    x="11"
    y="45"
    width="90"
    height="22"
    rx="5"
    fill="#7ce3bd"
    fill-opacity=".16"
    stroke="#7ce3bd"
    stroke-width="2.5"
  />
  <g fill="#7ce3bd">
    <rect x="20" y="48" width="20" height="16" rx="3" />
    <rect x="46" y="48" width="20" height="16" rx="3" />
    <rect x="72" y="48" width="20" height="16" rx="3" />
  </g>
</svg>
